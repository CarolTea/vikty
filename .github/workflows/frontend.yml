# Checks the web app: types, lint, storage rule, unit tests and build.
# Runs when the app, the design system or the API contract changes (push to main or PR); can also be run by hand in Actions.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'Docs/design-system/**'
      - 'Docs/api/openapi.yaml'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'Docs/design-system/**'
      - 'Docs/api/openapi.yaml'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check browser storage usage
        run: node scripts/check-storage.mjs
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
