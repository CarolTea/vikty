# Checa o frontend: testes, tipos, lint e build.
# Roda quando algo em frontend/ muda (push na main ou PR); também dá pra disparar à mão em Actions.
# frontend/ é o app do Lovable importado de CarolTea/victylp (ver README): usa Bun, não npm.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Testes
        run: bun test tests/
      - name: Checar tipos
        run: bunx tsc --noEmit
      # O código do victylp ainda não passa no Prettier. A correção é feita lá (bun run format) e
      # chega aqui no próximo pull; até lá o lint só avisa.
      - name: Lint
        continue-on-error: true
        run: bun run lint
      - name: Build
        run: bun run build
