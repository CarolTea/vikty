# Checa o frontend: tipos, lint, testes unitários e build.
# Roda quando algo em frontend/ muda (push na main ou PR); também dá pra disparar à mão em Actions.
# Enquanto frontend/package.json não existir, o job só avisa e passa.
# Cada passo usa `--if-present`: o script que o frontend não tiver é pulado.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Frontend já existe?
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package.json ainda não existe; nada pra testar."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.app.outputs.exists == 'true'
        run: npm ci
      - name: Checar tipos
        if: steps.app.outputs.exists == 'true'
        run: npm run typecheck --if-present
      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint --if-present
      # O script `test` precisa rodar uma vez e sair (ex.: `vitest run`), não ficar em modo watch.
      - name: Testes unitários
        if: steps.app.outputs.exists == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build --if-present
