# Publica o contrato de API (Docs/api) no GitHub Pages.
# Roda quando algo em Docs/api muda na main; também dá pra disparar à mão em Actions.
name: API docs

on:
  push:
    branches: [main]
    paths:
      - 'Docs/api/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    paths:
      - 'Docs/api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar o openapi.yaml
        run: npx --yes @redocly/cli@2.54.2 lint Docs/api/openapi.yaml

  deploy:
    # Só publica a partir da main; em PR, só valida.
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/api
      - id: deployment
        uses: actions/deploy-pages@v4
