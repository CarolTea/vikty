  /events:
    post:
      operationId: trackEvents
      summary: 24 · Eventos de analytics
      description: |
        `name` numa lista fechada; `props` sem texto livre de convicção e sem endereço de wallet: até 10
        chaves, textos de até 64 caracteres, e valor com formato de endereço Solana é recusado (`400`).
        O dono do evento é guardado só como hash da sessão e da wallet. Eventos que o backend já conhece
        (proposta gerada, operação confirmada) são emitidos por ele mesmo.
      tags: [Interface 1 — Descoberta, Todas as telas]
      security:
        - anonymousSession: []
        - privyToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [name, at]
                    properties:
                      name:
                        type: string
                        enum:
                          - discovery_started
                          - suggested_thesis_selected
                          - interpretation_corrected
                          - asset_rejected
                          - weight_changed
                          - operation_review_started
                      at: { type: string, format: date-time }
                      props:
                        type: object
                        additionalProperties:
                          type: [string, number, boolean]
            example:
              events:
                - { name: discovery_started, at: '2026-09-23T14:00:00Z', props: { source: suggested } }
      responses:
        '204': { description: Eventos aceitos }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    privyToken:
      type: http
      scheme: bearer
      description: Access token do Privy (login por Sign-In With Solana). O backend verifica com o SDK de servidor do Privy.
    anonymousSession:
      type: apiKey
      in: cookie
      name: victy_session
      description: Cookie de sessão anônima (`HttpOnly; Secure; SameSite=Lax`) emitido no primeiro `GET /session`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo front por intenção; o mesmo nas retentativas.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: '`VALIDATION_ERROR` · `TEXT_TOO_LONG`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: TEXT_TOO_LONG, message: 'Your thesis is over 600 characters.', retryAfter: null, details: { max: 600 } }
    Unauthorized:
      description: '`UNAUTHENTICATED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: UNAUTHENTICATED
              message: Connect your wallet to continue.
              retryAfter: null
              details: {}
    Forbidden:
      description: '`ANON_QUOTA_USED` · `WALLET_QUOTA_USED` · `EXPLANATIONS_USED` · `BOT_CHECK_FAILED` · `WALLET_MISMATCH`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: ANON_QUOTA_USED, message: 'You have used your free interpretation. Connect your wallet to interpret again.', retryAfter: null, details: {} }
    NotFound:
      description: '`NOT_FOUND` — inexistente ou de outra wallet'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: NOT_FOUND
              message: We couldn't find that.
              retryAfter: null
              details: {}
    Conflict:
      description: '`IDEMPOTENCY_CONFLICT` · `OPERATION_IN_PROGRESS` · `QUOTE_EXPIRED` · `MATERIAL_CHANGE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            operacaoEmAndamento:
              summary: Já existe operação ativa
              value:
                error:
                  code: OPERATION_IN_PROGRESS
                  message: You already have an operation in progress for this asset.
                  retryAfter: null
                  details:
                    operationId: op_3f9
            cotacaoExpirada:
              summary: Cotação vencida
              value:
                error:
                  code: QUOTE_EXPIRED
                  message: This quote expired. Get a new one to continue.
                  retryAfter: null
                  details: {}
            idempotencia:
              summary: Mesma chave, corpo diferente
              value:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This request was already sent with different values.
                  retryAfter: null
                  details: {}
            mudancaRelevante:
              summary: Nova cotação mudou de forma relevante
              value:
                error:
                  code: MATERIAL_CHANGE
                  message: The price changed. Review the new quote before continuing.
                  retryAfter: null
                  details:
                    operation:
                      id: op_3f9
                      planId: plan_7d1
                      side: buy
                      instrument:
                        id: ins_pwre
                        symbol: PWR-E
                        name: Power Generation Basket
                        mint: PwrE7Qm3vN8cXb2LkT5yHd9RzAfG4sJu6WoPeEnErGy1
                        decimals: 6
                        kind: token
                        status: approved
                        exposureLabel: Power generation
                        issuerName: Meridian Tokenized Assets (fictional)
                      status: ready_for_review
                      balanceUpdating: false
                      review:
                        inputAmount: "175.00"
                        inputSymbol: USDC
                        estimatedOutput: "19.200000"
                        outputSymbol: PWR-E
                        minimumOutput: "19.104000"
                        slippageBps: 50
                        fees:
                          - label: Platform fee
                            amount: "0.09"
                            symbol: USDC
                          - label: Network fee
                            amount: "0.000005"
                            symbol: SOL
                        destinationWallet: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
                        expiresAt: 2026-09-23T14:22:00Z
                        planEffect:
                          targetBps: 3500
                          currentBps: 0
                          afterBps: 3500
                      transaction: AQABAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVFVWV1hZWltcXV5fYGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6e3x9fn8=
                      result:
                        signature: null
