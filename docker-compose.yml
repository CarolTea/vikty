# VicTy — local development stack (DRAFT)
# Runs the backend and its database. The frontend runs with its own dev server (not containerized).
# Usage: cp backend/.env.example backend/.env  →  docker compose up --build

services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      # Inside the compose network the database host is the service name, not localhost
      DATABASE_URL: postgres://vikty:vikty@db:5432/vikty
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Persistence for plans, operation intents, requestId, signatures and states.
  # Postgres is a proposal — confirm when the backend stack is chosen.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vikty
      POSTGRES_PASSWORD: vikty
      POSTGRES_DB: vikty
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikty -d vikty"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
